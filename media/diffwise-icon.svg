<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">DiffWise AI Code Diff Reviewer</title>
  <desc id="desc">A blue AI circuit chip above two code panes showing red deletions and teal additions, reviewed through a magnifying glass with a check mark, with DW lettering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171a20"/><stop offset="1" stop-color="#0c0e12"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="68%">
      <stop offset="0" stop-color="#182536" stop-opacity=".65"/><stop offset="1" stop-color="#0c0e12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24d8f5"/><stop offset=".5" stop-color="#1689f9"/><stop offset="1" stop-color="#0754ce"/>
    </linearGradient>
    <linearGradient id="blueStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#278dff"/><stop offset="1" stop-color="#0644a8"/>
    </linearGradient>
    <linearGradient id="tealStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27e8bd"/><stop offset="1" stop-color="#078a77"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5f69"/><stop offset="1" stop-color="#e92e50"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#28efbd"/><stop offset="1" stop-color="#08bda7"/>
    </linearGradient>
    <linearGradient id="mutedLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6987ae"/><stop offset="1" stop-color="#435d81"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20d8fa"/><stop offset=".6" stop-color="#0879f8"/><stop offset="1" stop-color="#0751d2"/>
    </linearGradient>
    <linearGradient id="dwW" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2bd6f5"/><stop offset="1" stop-color="#0875ee"/>
    </linearGradient>
    <linearGradient id="paneLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182437"/><stop offset="1" stop-color="#10151e"/>
    </linearGradient>
    <linearGradient id="paneRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#142c2e"/><stop offset="1" stop-color="#10171c"/>
    </linearGradient>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset dy="5" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope=".34"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.00  0 0 0 0 0.50  0 0 0 0 1.00  0 0 0 .28 0" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark developer-tool canvas -->
  <rect width="1024" height="1024" rx="0" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#bgGlow)"/>

  <!-- Two diff panes -->
  <g filter="url(#softShadow)">
    <path d="M203 289 Q211 268 238 272 L454 294 Q482 297 482 326 L482 663 Q482 691 453 697 L231 714 Q194 716 192 680 L192 321 Q192 300 203 289Z" fill="url(#paneLeft)" stroke="url(#blueStroke)" stroke-width="13"/>
    <path d="M548 298 L812 273 Q842 270 847 303 L847 678 Q845 708 815 707 L565 691 Q538 689 538 660 L538 330 Q538 306 548 298Z" fill="url(#paneRight)" stroke="url(#tealStroke)" stroke-width="13"/>
  </g>

  <!-- Left pane chrome and deleted lines -->
  <g fill="#7396c3" opacity=".95">
    <circle cx="232" cy="334" r="12"/><circle cx="268" cy="337" r="12"/><circle cx="303" cy="339" r="12"/>
  </g>
  <g fill="url(#mutedLine)" opacity=".92">
    <rect x="228" y="371" width="194" height="20" rx="9" transform="rotate(3 228 371)"/>
    <rect x="267" y="487" width="150" height="19" rx="9"/>
    <rect x="232" y="596" width="158" height="19" rx="9" transform="rotate(-2 232 596)"/>
  </g>
  <g fill="url(#red)">
    <rect x="214" y="417" width="29" height="11" rx="5"/>
    <rect x="261" y="412" width="203" height="22" rx="8" transform="rotate(2 261 412)"/>
    <rect x="261" y="449" width="104" height="21" rx="8"/>
    <rect x="214" y="527" width="29" height="11" rx="5"/>
    <rect x="261" y="520" width="140" height="21" rx="8"/>
    <rect x="261" y="557" width="66" height="20" rx="8"/>
    <rect x="214" y="646" width="29" height="11" rx="5"/>
    <rect x="261" y="636" width="146" height="21" rx="8" transform="rotate(-2 261 636)"/>
    <rect x="261" y="674" width="100" height="19" rx="8"/>
  </g>

  <!-- Right pane chrome and added lines -->
  <g fill="#7396c3" opacity=".95">
    <circle cx="582" cy="350" r="12"/><circle cx="617" cy="347" r="12"/><circle cx="652" cy="344" r="12"/>
  </g>
  <g fill="url(#mutedLine)" opacity=".92">
    <rect x="588" y="386" width="202" height="20" rx="9" transform="rotate(-3 588 386)"/>
    <rect x="613" y="488" width="139" height="19" rx="9"/>
    <rect x="650" y="596" width="140" height="20" rx="9"/>
    <rect x="650" y="635" width="138" height="20" rx="9"/>
  </g>
  <g fill="url(#green)">
    <path d="M575 423h22m-11-11v22" stroke="#22dfbc" stroke-width="7" stroke-linecap="round" fill="none"/>
    <rect x="612" y="414" width="142" height="22" rx="9"/>
    <rect x="612" y="450" width="190" height="22" rx="9"/>
    <path d="M620 531h22m-11-11v22" stroke="#22dfbc" stroke-width="7" stroke-linecap="round" fill="none"/>
    <rect x="666" y="522" width="130" height="21" rx="9"/>
    <path d="M622 641h22m-11-11v22" stroke="#22dfbc" stroke-width="7" stroke-linecap="round" fill="none"/>
    <rect x="666" y="632" width="112" height="21" rx="9"/>
  </g>

  <!-- AI circuit and processor -->
  <g fill="none" stroke="url(#blue)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
    <path d="M438 204H402L375 178"/><path d="M438 246H346"/><path d="M438 285H395L378 302"/>
    <path d="M585 204H623L649 178"/><path d="M585 246H675"/><path d="M585 285H631L650 303"/>
    <path d="M472 143V112M512 143V107M552 143V112"/>
    <path d="M472 302V335M512 302V447M552 302V335"/>
  </g>
  <g fill="#0f1825" stroke="url(#blue)" stroke-width="11" filter="url(#softShadow)">
    <rect x="440" y="143" width="145" height="164" rx="28"/>
  </g>
  <g fill="url(#blue)" stroke="none">
    <circle cx="375" cy="178" r="14"/><circle cx="346" cy="246" r="14"/><circle cx="378" cy="302" r="14"/>
    <circle cx="649" cy="178" r="14"/><circle cx="675" cy="246" r="14"/><circle cx="650" cy="303" r="14"/>
  </g>
  <g fill="#0f1723" stroke="#21c9f5" stroke-width="6">
    <circle cx="375" cy="178" r="6"/><circle cx="346" cy="246" r="6"/><circle cx="649" cy="178" r="6"/><circle cx="675" cy="246" r="6"/>
  </g>
  <text x="512" y="249" fill="url(#blue)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="73" font-weight="750" text-anchor="middle" letter-spacing="-4">AI</text>

  <!-- Review magnifier and approval mark -->
  <g filter="url(#softShadow)">
    <path d="M591 648 L666 725 Q680 740 665 756 L653 768 Q640 780 626 765 L553 687Z" fill="url(#glass)" stroke="#0755cb" stroke-width="7"/>
    <circle cx="512" cy="577" r="113" fill="#0c121b" stroke="url(#glass)" stroke-width="26"/>
    <circle cx="512" cy="577" r="91" fill="#172332" stroke="#24394e" stroke-width="5"/>
    <path d="M464 577 L493 608 L552 546" fill="none" stroke="#20e7bc" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- DW monogram -->
  <text x="448" y="858" fill="#f7f9fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="124" font-weight="800" text-anchor="middle" letter-spacing="-8">D</text>
  <text x="574" y="858" fill="url(#dwW)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="124" font-weight="800" text-anchor="middle" letter-spacing="-8">W</text>
</svg>
